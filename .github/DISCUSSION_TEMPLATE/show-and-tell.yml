title: "[Show and tell] "
body:
  - type: markdown
    attributes:
      value: |
        Share what you built with polisade! Keep it free of internal or sensitive
        data — Discussions here are public.
  - type: textarea
    id: what
    attributes:
      label: What did you build?
      description: A short description, screenshots, or a link.
    validations:
      required: true
  - type: input
    id: commands
    attributes:
      label: Which /polisade:* commands did you use?
    validations:
      required: false
